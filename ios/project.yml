name: Sketchpad
options:
  bundleIdPrefix: com.rylai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
targets:
  Sketchpad:
    type: application
    platform: iOS
    sources:
      - path: Sketchpad
    info:
      path: Sketchpad/Info.plist
      properties:
        CFBundleDisplayName: Sketchpad
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: false
        NSLocalNetworkUsageDescription: Sketchpad connects to the agent running on your own computer. Nothing leaves your network.
        # Answered here rather than by hand on every App Store submission. The app uses TLS and the
        # platform's own crypto, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        NSBonjourServices:
          - _sketchpad._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rylai.sketchpad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: false
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
  SketchpadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SketchpadTests
    dependencies:
      - target: Sketchpad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rylai.sketchpad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  Sketchpad:
    build:
      targets:
        Sketchpad: all
        SketchpadTests: [test]
    test:
      targets: [SketchpadTests]
    run:
      config: Debug
