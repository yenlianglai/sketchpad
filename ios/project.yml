name: Sketchpad
options:
  bundleIdPrefix: com.rylai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
targets:
  Sketchpad:
    type: application
    platform: iOS
    sources:
      - path: Sketchpad
    info:
      path: Sketchpad/Info.plist
      properties:
        CFBundleDisplayName: Sketchpad
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: false
        NSLocalNetworkUsageDescription: Sketchpad 需要在區域網路上找到並連線到你電腦上的 agent。
        NSCameraUsageDescription: 掃描電腦上顯示的 QR code 來配對。
        NSBonjourServices:
          - _sketchpad._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rylai.sketchpad
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: false
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
