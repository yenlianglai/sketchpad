<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sketch + Voice → Claude</title>
<style>
  :root { --bg:#f4f4f2; --ink:#1a1a1a; --mute:#777; --accent:#c8552b; --ok:#2d8a4e; --panel:#fff; --line:#ddd; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system,system-ui,sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns:1fr 340px; grid-template-rows:52px 1fr auto; height:100%; }
  header { grid-column:1/-1; display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .title { font-weight:600; margin-right:auto; }
  .dot { width:9px; height:9px; border-radius:50%; background:#bbb; display:inline-block; margin-right:4px; }
  .dot.on { background:var(--ok); } .dot.warn { background:var(--accent); }
  .status { color:var(--mute); font-size:13px; }
  #canvasWrap { position:relative; background:#fff; touch-action:none; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #tools { position:absolute; left:12px; top:12px; display:flex; flex-direction:column; gap:6px; }
  button, select { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:9px 12px; min-width:44px; min-height:44px; }
  button.active { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
  .swatch { width:44px; height:44px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); }
  .swatch.active { box-shadow:0 0 0 2px var(--ink); }
  aside { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:12px 14px 6px; }
  #log { flex:1; overflow-y:auto; padding:0 14px 14px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 12px; border-radius:12px; max-width:100%; white-space:pre-wrap; word-break:break-word; }
  .msg.user { background:#eef0ee; align-self:flex-end; }
  .msg.assistant { background:#fff4ee; border:1px solid #f1d9cc; align-self:flex-start; }
  .msg.sys { color:var(--mute); font-size:12px; align-self:center; background:none; padding:2px; }
  .msg img { max-width:100%; border-radius:8px; margin-top:6px; display:block; }
  .msg a { color:var(--accent); }
  footer { grid-column:1/-1; display:flex; align-items:center; gap:10px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
  #mic { width:64px; height:64px; border-radius:50%; font-size:26px; border:2px solid var(--line); }
  #mic.listening { background:var(--accent); color:#fff; border-color:var(--accent); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(200,85,43,.4);} 50%{ box-shadow:0 0 0 12px rgba(200,85,43,0);} }
  #transcript { flex:1; min-height:44px; max-height:96px; overflow-y:auto; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  #transcript .interim { color:var(--mute); }
  #transcript:empty::before { content:"按住麥克風說話，或直接畫圖後送出"; color:#aaa; }
  #send { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600; padding:0 18px; height:48px; }
  label.toggle { display:flex; align-items:center; gap:4px; color:var(--mute); font-size:13px; }
  @media (max-width: 820px) { #app { grid-template-columns:1fr; grid-template-rows:52px 1fr 180px auto; } aside { border-left:0; border-top:1px solid var(--line);} }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">Sketch + Voice → Claude</span>
    <span class="status"><span class="dot" id="wsDot"></span>server</span>
    <span class="status"><span class="dot" id="mcpDot"></span><span id="modeLabel">Claude Code</span></span>
    <select id="lang" title="語音語言">
      <option value="zh-TW">中文（台灣）</option>
      <option value="en-US">English</option>
      <option value="ja-JP">日本語</option>
    </select>
    <label class="toggle"><input type="checkbox" id="autoSend" checked> 說完自動送出</label>
    <label class="toggle"><input type="checkbox" id="tts" checked> 朗讀回覆</label>
    <label class="toggle"><input type="checkbox" id="penOnly" checked> 只接受 Pencil</label>
  </header>

  <div id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div id="tools">
      <button class="swatch active" data-color="#1a1a1a" style="background:#1a1a1a"></button>
      <button class="swatch" data-color="#c8552b" style="background:#c8552b"></button>
      <button class="swatch" data-color="#2457b3" style="background:#2457b3"></button>
      <button id="eraser" title="橡皮擦">◻︎</button>
      <button id="undo" title="復原">↶</button>
      <button id="clear" title="清空">✕</button>
    </div>
  </div>

  <aside>
    <h2>對話</h2>
    <div id="log"></div>
  </aside>

  <footer>
    <button id="mic" title="按住說話">🎙</button>
    <div id="transcript"></div>
    <button id="send">送出</button>
  </footer>
</div>

<script>
// ---------------------------------------------------------------- plumbing
const token = new URLSearchParams(location.search).get('token') || ''
const q = token ? `?token=${encodeURIComponent(token)}` : ''
const $ = id => document.getElementById(id)
const log = $('log')
function addMsg(kind, text, files = []) {
  const el = document.createElement('div'); el.className = `msg ${kind}`
  el.textContent = text || ''
  for (const f of files) {
    const isImg = /\.(png|jpe?g|gif|webp|svg)$/i.test(f.name)
    const href = f.url.startsWith('/') ? f.url + q : f.url // data: URLs carry no token
    if (isImg) { const img = document.createElement('img'); img.src = href; img.alt = f.name; el.appendChild(img) }
    else { const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.textContent = `[${f.name}]`; el.appendChild(a) }
  }
  log.appendChild(el); log.scrollTop = log.scrollHeight
  return el
}

// WebSocket: replies from Claude + server status
let ws
function connectWS() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws${q}`)
  ws.onopen = () => $('wsDot').className = 'dot on'
  ws.onclose = () => { $('wsDot').className = 'dot'; $('mcpDot').className = 'dot'; setTimeout(connectWS, 1500) }
  ws.onmessage = e => {
    const m = JSON.parse(e.data)
    if (m.type === 'hello' || m.type === 'mcp') {
      const ready = m.ready ?? m.mcp
      $('mcpDot').className = `dot ${ready ? 'on' : 'warn'}`
      $('modeLabel').textContent = m.mode === 'headless' ? 'Claude (headless)' : 'Claude Code'
      if (m.type === 'hello' && !ready) addMsg('sys', m.mode === 'none' ? 'web-only 模式，回合只會存檔' : '等待 Claude 就緒…')
      if (m.type === 'mcp' && ready && m.model) addMsg('sys', `Claude 已就緒 · ${m.model}`)
    }
    if (m.type === 'sys') addMsg('sys', m.text)
    if (m.type === 'taken') addMsg('sys', 'agent 已讀取這回合')
    if (m.type === 'snapshot_request') {
      const png = strokes.length ? canvas.toDataURL('image/png') : null
      fetch(`/snapshot${q}`, { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ id: m.id, png }) }).catch(() => {})
    }
    if (m.type === 'reply') {
      addMsg('assistant', m.text, m.files)
      if ($('tts').checked && m.text) speak(m.text)
    }
  }
}
connectWS()

function speak(text) {
  try {
    speechSynthesis.cancel()
    const u = new SpeechSynthesisUtterance(text); u.lang = $('lang').value; u.rate = 1.05
    speechSynthesis.speak(u)
  } catch {}
}

// ---------------------------------------------------------------- canvas
const canvas = $('canvas'), ctx = canvas.getContext('2d')
let dpr = 1, strokes = [], current = null, color = '#1a1a1a', erasing = false, penSeen = false, strokesSinceSend = 0
function resize() {
  dpr = window.devicePixelRatio || 1
  const r = canvas.parentElement.getBoundingClientRect()
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr)
  redraw()
}
function redraw() {
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height)
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'
  for (const s of strokes) drawStroke(s)
}
function drawStroke(s, fromIdx = 1) {
  ctx.strokeStyle = s.erase ? '#fff' : s.color
  for (let i = Math.max(1, fromIdx); i < s.pts.length; i++) {
    const a = s.pts[i-1], b = s.pts[i]
    ctx.lineWidth = s.erase ? 24 : 1.5 + 5 * (b.p || 0.5)
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
  }
}
function accept(e) {
  if (e.pointerType === 'pen') penSeen = true
  if ($('penOnly').checked && penSeen && e.pointerType === 'touch') return false
  return true
}
canvas.addEventListener('pointerdown', e => {
  if (!accept(e)) return
  canvas.setPointerCapture(e.pointerId)
  current = { color, erase: erasing, pts: [{ x:e.offsetX, y:e.offsetY, p:e.pressure }] }
  strokes.push(current); strokesSinceSend++
})
canvas.addEventListener('pointermove', e => {
  if (!current || !accept(e)) return
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]
  const start = current.pts.length
  for (const ev of evs) current.pts.push({ x:ev.offsetX, y:ev.offsetY, p:ev.pressure })
  drawStroke(current, start)
})
const end = () => { current = null }
canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end)
window.addEventListener('resize', resize); resize()

document.querySelectorAll('.swatch').forEach(b => b.onclick = () => {
  document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active')); b.classList.add('active')
  color = b.dataset.color; erasing = false; $('eraser').classList.remove('active')
})
$('eraser').onclick = () => { erasing = !erasing; $('eraser').classList.toggle('active', erasing) }
$('undo').onclick = () => { strokes.pop(); redraw() }
$('clear').onclick = () => { strokes = []; redraw() }

// ---------------------------------------------------------------- speech
const SR = window.SpeechRecognition || window.webkitSpeechRecognition
const mic = $('mic'), transcriptEl = $('transcript')
let rec = null, finalText = '', interim = '', listening = false, speechStart = 0, silenceTimer = null
function renderTranscript() {
  transcriptEl.innerHTML = ''
  transcriptEl.append(finalText)
  if (interim) { const s = document.createElement('span'); s.className = 'interim'; s.textContent = ' ' + interim; transcriptEl.append(s) }
  transcriptEl.scrollTop = transcriptEl.scrollHeight
}
function armAutoSend() {
  clearTimeout(silenceTimer)
  if ($('autoSend').checked) silenceTimer = setTimeout(() => { if (finalText.trim()) sendTurn() }, 1800)
}
function startListening() {
  if (!SR) { addMsg('sys', '這個瀏覽器沒有 SpeechRecognition。iPad 請用 Safari，且需 https。'); return }
  if (listening) return
  rec = new SR(); rec.lang = $('lang').value; rec.continuous = true; rec.interimResults = true
  rec.onresult = e => {
    interim = ''
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i]
      if (r.isFinal) { finalText += r[0].transcript; armAutoSend() } else interim += r[0].transcript
    }
    renderTranscript()
  }
  rec.onerror = e => { addMsg('sys', `語音錯誤: ${e.error}`); stopListening() }
  rec.onend = () => { if (listening) { try { rec.start() } catch {} } } // Safari stops after a pause; keep going
  try { rec.start(); listening = true; speechStart = speechStart || Date.now(); mic.classList.add('listening') }
  catch (err) { addMsg('sys', `無法啟動麥克風: ${err.message}`) }
}
function stopListening() {
  listening = false; mic.classList.remove('listening')
  try { rec && rec.stop() } catch {}
  interim = ''; renderTranscript()
}
mic.onclick = () => listening ? stopListening() : startListening()

// ---------------------------------------------------------------- send turn
async function sendTurn() {
  clearTimeout(silenceTimer)
  const text = (finalText + ' ' + interim).trim()
  const hasDrawing = strokes.length > 0
  if (!text && !hasDrawing) return
  const png = hasDrawing ? canvas.toDataURL('image/png') : null
  const durationMs = speechStart ? Date.now() - speechStart : null
  const el = addMsg('user', text || '（只有圖）')
  if (png) { const img = document.createElement('img'); img.src = png; el.appendChild(img) }
  const body = JSON.stringify({ text, png, strokes: strokesSinceSend, durationMs })
  finalText = ''; interim = ''; speechStart = listening ? Date.now() : 0; strokesSinceSend = 0; renderTranscript()
  try {
    const r = await fetch(`/turn${q}`, { method:'POST', headers:{ 'content-type':'application/json' }, body })
    const j = await r.json()
    if (!j.delivered) addMsg('sys', `已存檔 ${j.pngPath || ''}，但尚未送進 Claude Code（server 未接上 MCP）`)
  } catch (err) { addMsg('sys', `送出失敗: ${err.message}`) }
}
$('send').onclick = sendTurn
</script>
</body>
</html>
